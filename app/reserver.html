<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CamBus Express - Réserver un billet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body data-page="reserver">
  <div id="siteHeader"></div>
  <main>
    <section class="wrap page-h up">
      <span class="badge"><i data-lucide="ticket"></i> Réservation</span>
      <h1>Réservez votre <span class="grad">billet</span></h1>
      <p class="sub">Remplissez le formulaire : votre e-billet est généré instantanément.</p>
    </section>

    <section class="wrap two">
      <!-- Colonne gauche : formulaire -->
      <form class="card up" style="--d:2" id="formReservation" novalidate>
        <div class="field"><label for="nomClient">Nom complet du passager</label>
          <div class="ic"><i data-lucide="user"></i><input class="inp" type="text" id="nomClient" placeholder="Ex : Jean Dupont" autocomplete="name"></div>
          <div class="err" id="err-nomClient"></div></div>
        <div class="field"><label for="telephone">Numéro de téléphone</label>
          <div class="ic"><i data-lucide="phone"></i><input class="inp" type="tel" id="telephone" placeholder="6XXXXXXXX" inputmode="numeric" autocomplete="tel"></div>
          <div class="err" id="err-telephone"></div></div>
        <div class="field"><label for="trajet">Trajet</label>
          <div class="ic"><i data-lucide="route"></i>
            <select class="inp" id="trajet">
              <option value="Douala - Yaoundé">Douala - Yaoundé</option>
              <option value="Yaoundé - Bafoussam">Yaoundé - Bafoussam</option>
              <option value="Douala - Bafoussam">Douala - Bafoussam</option>
              <option value="Douala - Kribi">Douala - Kribi</option>
            </select></div>
          <div class="err" id="err-trajet"></div></div>
        <div class="field"><label for="dateDepart">Date de départ</label>
          <div class="ic"><i data-lucide="calendar-days"></i><input class="inp" type="date" id="dateDepart"></div>
          <div class="err" id="err-dateDepart"></div></div>
        <div class="field"><span class="lbl">Classe de voyage</span>
          <div class="cls" id="classe">
            <label class="cc"><input type="radio" name="classe" value="Classique" checked>
              <div class="cc-in"><h4><i data-lucide="armchair"></i> Classique</h4><div class="pr2">5 000 <small>FCFA / place</small></div>
                <ul><li><i data-lucide="check"></i> Climatisation</li><li><i data-lucide="check"></i> Siège confort</li><li><i data-lucide="check"></i> Bagage 20kg</li></ul></div></label>
            <label class="cc vip"><input type="radio" name="classe" value="VIP">
              <div class="cc-in"><h4><i data-lucide="crown"></i> VIP</h4><div class="pr2">10 000 <small>FCFA / place</small></div>
                <ul><li><i data-lucide="check"></i> Siège cuir inclinable</li><li><i data-lucide="check"></i> Wi-Fi</li><li><i data-lucide="check"></i> Collation</li><li><i data-lucide="check"></i> Prioritaire</li></ul></div></label>
          </div></div>
        <div class="field"><label for="places">Nombre de places (1 à 10)</label>
          <div class="stepper">
            <button type="button" id="placesMoins" aria-label="Moins de places"><i data-lucide="minus"></i></button>
            <input class="inp" type="text" id="places" value="1" readonly>
            <button type="button" id="placesPlus" aria-label="Plus de places"><i data-lucide="plus"></i></button>
          </div></div>
        <button class="btn btn-p full" type="submit" id="btnSubmit"><i data-lucide="ticket"></i> Confirmer la réservation</button>
      </form>

      <!-- Colonne droite : récapitulatif en direct / e-billet -->
      <aside class="side">
        <div class="card up" style="--d:3" id="recap">
          <h3 style="margin-bottom:.6rem;display:flex;gap:.6rem;align-items:center"><i data-lucide="receipt" style="color:var(--em)"></i> Récapitulatif</h3>
          <div class="rl"><span>Trajet</span><b id="recapTrajet">-</b></div>
          <div class="rl"><span>Classe</span><b id="recapClasse">Classique</b></div>
          <div class="rl"><span>Prix unitaire</span><b id="recapUnit">5 000 FCFA</b></div>
          <div class="rl"><span>Nombre de places</span><b id="recapPlaces">1</b></div>
          <div class="tot"><span class="lbl">Montant total</span><span><strong id="recapTotal">5 000</strong> <b>FCFA</b></span></div>
        </div>
        <div id="zoneBillet" hidden></div>
      </aside>
    </section>
  </main>
  <div id="siteFooter"></div>
  <script src="app.js"></script>
</body>
</html>
